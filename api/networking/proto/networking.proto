syntax = "proto3";

package networking;

option go_package = "github.com/himalayo/clusterfuck/networking/proto";

service Networking {
	rpc SendPacket (Packet) returns (SuccessMessage) {}
	rpc SendPackets (Packets) returns (SuccessMessage) {}
}

message Packets {
	string client_id = 1;
	repeated bytes packets = 2;
}

message Packet {
	string client_id = 1;
	bytes packet = 2;
}

message SuccessMessage {
	bool successful = 1;
}
